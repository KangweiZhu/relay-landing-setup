name: 复现构建

# bin/ 里的程序变了，就从上游源码重新构建一遍，和仓库里的逐字节比对
on:
  push:
    paths: ["bin/**", "scripts/build-bins.sh"]
  pull_request:
    paths: ["bin/**", "scripts/build-bins.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: 按 versions.env 重新构建
        run: |
          cp bin/SHA256SUMS /tmp/SHA256SUMS.committed
          scripts/build-bins.sh
      - name: 和仓库里的产物比对
        run: |
          if diff -u /tmp/SHA256SUMS.committed bin/SHA256SUMS; then
            echo "✔ 从源码构建的结果和仓库里的产物完全一致"
          else
            echo "✘ 仓库里的产物和源码构建结果不一致" >&2
            exit 1
          fi
